spring.application.name=robot-repair
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/repair}
spring.datasource.username=${DB_USER:repair}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=repair-results-v2
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.listener.ack-mode=record
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.error.include-message=never
app.files=${FILE_ROOT:./data/files}
app.internal-token=${INTERNAL_SERVICE_TOKEN}
app.cors-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.mcp-url=${MCP_URL:http://localhost:8089/mcp}
app.mcp-token=${MCP_TOKEN:}
app.commands-topic=diagnosis.commands.v2
app.events-topic=diagnosis.events.v2
